<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dart Counter</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, system-ui, sans-serif; margin:0; padding:10px; background:#1a1a2e; color:#eee; min-height:100vh; padding-bottom:80px; }
  h1 { text-align:center; font-size:1.4em; margin:5px 0 15px; color:#4fc3f7; }
  .screen { max-width:640px; margin:0 auto; }
  .hidden { display:none !important; }
  .setup input[type=text] { width:100%; padding:12px; font-size:1em; margin:5px 0; border-radius:8px; border:1px solid #444; background:#16213e; color:#eee; }
  .setup .row { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }
  .setup label { flex:1; min-width:140px; display:flex; flex-direction:column; gap:4px; font-size:0.9em; color:#aaa;}
  select, button { padding:12px; font-size:1em; border-radius:8px; border:1px solid #444; background:#16213e; color:#eee; }
  button.primary { background:#4fc3f7; color:#001; font-weight:bold; border:none; }
  .player-list { margin:10px 0; }
  .player-row { display:flex; align-items:center; gap:8px; background:#16213e; padding:8px; border-radius:8px; margin:5px 0; }
  .player-row input { flex:1; padding:8px; border-radius:6px; border:1px solid #333; background:#0f1626; color:#eee; }
  .remove-btn { background:#c62828; border:none; padding:8px 12px; border-radius:6px; color:#fff; }
  .players-scores { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .player-card { flex:1; min-width:140px; background:#16213e; border-radius:12px; padding:10px; text-align:center; border:2px solid transparent; transition:all 0.2s; }
  .player-card.active { border-color:#4fc3f7; background:#1f2f4f; }
  .player-card .name { font-size:0.9em; color:#aaa; margin-bottom:4px; }
  .player-card .score { font-size:2.4em; font-weight:bold; color:#4fc3f7; }
  .player-card .hint { font-size:0.8em; color:#ffb74d; min-height:1.1em; margin-top:4px; }
  .player-card .cricket-grid { font-size:0.75em; color:#bbb; text-align:left; margin-top:4px; line-height:1.3; }
  .darts-bar { display:flex; gap:6px; justify-content:center; margin-bottom:8px; }
  .dart-slot { flex:1; max-width:90px; height:56px; border-radius:8px; background:#0f1626; border:2px dashed #333; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:bold; }
  .dart-slot.filled { border-style:solid; border-color:#4fc3f7; background:#1f2f4f; color:#4fc3f7; }
  .dart-slot.current { border-color:#ffb74d; border-style:solid; background:#2a2f1f; }
  .dart-slot .slot-label { font-size:0.7em; color:#666; }
  .dart-slot.filled .slot-label { color:#4fc3f7; }
  .dart-slot.current .slot-label { color:#ffb74d; }
  .dart-slot .slot-value { font-size:1.1em; }
  .darts-sum { text-align:center; font-size:1.1em; color:#4fc3f7; font-weight:bold; margin-bottom:10px; min-height:1.4em; }
  .input-area { background:#16213e; border-radius:12px; padding:12px; }
  .score-display { width:100%; font-size:1.3em; text-align:center; padding:10px; border-radius:8px; background:#0f1626; color:#fff; margin-bottom:10px; border:2px solid #4fc3f7; }
  .modifier-row { display:flex; gap:8px; margin-bottom:8px; }
  .modifier-row button { flex:1; font-size:1em; font-weight:bold; padding:14px; border-radius:8px; border:none; }
  .modifier-row button.active { outline:3px solid #fff; }
  #btnSingle { background:#546e7a; color:#fff; }
  #btnDouble { background:#ff9800; color:#000; }
  #btnTriple { background:#e91e63; color:#fff; }
  #btnBull { background:#7e57c2; color:#fff; }
  .numpad { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:8px; }
  .numpad button { padding:14px 0; font-size:1.1em; font-weight:bold; border-radius:8px; border:none; background:#37474f; color:#fff; }
  .numpad button:active { background:#4fc3f7; color:#000; }
  .numpad button.miss { background:#616161; }
  .numpad button.wide { grid-column:span 2; background:#455a64; }
  .action-row { display:flex; gap:8px; }
  .action-row button { flex:1; padding:16px; font-size:1.1em; font-weight:bold; border-radius:8px; border:none; }
  #btnSubmit { background:#4caf50; color:#fff; }
  #btnClear { background:#ff9800; color:#000; }
  #btnUndo { background:#c62828; color:#fff; font-size:0.9em; }
  .status { text-align:center; padding:8px; font-size:1.05em; margin-top:8px; border-radius:8px; }
  .status.bust { background:#b71c1c; color:#ffcdd2; }
  .status.info { background:#1a3a5a; color:#a5d6f7; }
  .status.win { background:#4caf50; color:#fff; font-weight:bold; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:6px; flex-wrap:wrap; }
  .top-bar button { font-size:0.85em; padding:8px 10px; }
  .winner-banner { background:linear-gradient(135deg,#4caf50,#2e7d32); padding:20px; border-radius:12px; text-align:center; margin-bottom:12px; font-size:1.3em; font-weight:bold; }
  .stats-table { width:100%; border-collapse:collapse; font-size:0.85em; margin-top:8px; }
  .stats-table th, .stats-table td { padding:6px 4px; border-bottom:1px solid #2a3550; text-align:center; }
  .stats-table th { color:#4fc3f7; }
  .stats-table td:first-child, .stats-table th:first-child { text-align:left; color:#ddd; }
  h2 { font-size:1.1em; color:#4fc3f7; margin:16px 0 6px; }
  .voice-toggle { display:flex; align-items:center; gap:8px; justify-content:center; margin-top:8px; font-size:0.85em; color:#aaa; }
</style>
</head>
<body>
<div class="screen">
  <div id="setupScreen">
    <h1>🎯 Dart Counter</h1>
    <div class="setup">
      <div class="row">
        <label>Spielart:
          <select id="gameMode">
            <option value="501">501</option>
            <option value="301">301</option>
            <option value="701">701</option>
            <option value="101">101</option>
            <option value="cricket">Cricket</option>
          </select>
        </label>
        <label>Finish (X01):
          <select id="finishMode">
            <option value="double">Double Out</option>
            <option value="triple">Triple Out</option>
            <option value="straight">Straight Out</option>
          </select>
        </label>
      </div>
      <div class="player-list" id="playerList"></div>
      <button onclick="addPlayerInput()" style="width:100%; margin-bottom:10px;">+ Spieler hinzufügen</button>
      <label class="voice-toggle"><input type="checkbox" id="voiceToggle" checked> 🔊 Sprachausgabe der Wurf-Summe</label>
      <button class="primary" onclick="startGame()" style="width:100%; font-size:1.2em; padding:16px; margin-top:10px;">Spiel starten</button>
    </div>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="top-bar">
      <button onclick="confirmNewGame()">↩ Neues Spiel</button>
      <span id="modeLabel" style="color:#aaa; font-size:0.85em;"></span>
      <button onclick="toggleStats()">📊 Statistik</button>
    </div>
    <div id="winnerBanner" class="winner-banner hidden"></div>
    <div id="statsPanel" class="hidden" style="background:#16213e; border-radius:12px; padding:12px; margin-bottom:12px;">
      <h2>Statistik</h2>
      <table class="stats-table" id="statsTable"></table>
      <div style="text-align:center; margin-top:10px;"><button onclick="toggleStats()">Schließen</button></div>
    </div>
    <div class="players-scores" id="playersScores"></div>
    <div class="input-area" id="inputArea">
      <!-- 3 Dart Slots -->
      <div class="darts-bar" id="dartsBar"></div>
      <div class="darts-sum" id="dartsSum"></div>

      <div class="score-display" id="scoreDisplay">Wähle Multiplikator & Zahl</div>

      <div class="modifier-row">
        <button id="btnSingle" onclick="setMult(1)">Einfach</button>
        <button id="btnDouble" onclick="setMult(2)">Double</button>
        <button id="btnTriple" onclick="setMult(3)">Triple</button>
        <button id="btnBull" onclick="setBull()">Bull</button>
      </div>

      <div class="numpad" id="numpad"></div>

      <div class="action-row">
        <button id="btnClear" onclick="removeLastDart()">⌫ Letzter</button>
        <button id="btnSubmit" onclick="submitTurn()">OK (Aufnahme fertig)</button>
      </div>

      <div style="margin-top:8px; display:flex; gap:8px;">
        <button id="btnUndo" onclick="undo()" style="flex:1;">↶ Undo Aufnahme</button>
      </div>
    </div>
    <div id="statusMsg" class="status hidden"></div>
  </div>
</div>

<script>
const CRICKET_TARGETS = [20,19,18,17,16,15,25];
let state = { mode:'x01', players:[], currentPlayer:0, startScore:501, finishMode:'double', gameOver:false, history:[], stats:[], voiceOn:true };
let current = { multiplier: 1, base: null };
let turnDarts = [];

function addPlayerInput(name='') {
  const row = document.createElement('div');
  row.className = 'player-row';
  row.innerHTML = `<input type="text" placeholder="Spielername" value="${name}"><button class="remove-btn" onclick="this.parentNode.remove()">✕</button>`;
  document.getElementById('playerList').appendChild(row);
}
addPlayerInput('Spieler 1'); addPlayerInput('Spieler 2');

function startGame() {
  const names = [];
  document.querySelectorAll('#playerList input').forEach(inp => { const n = inp.value.trim(); if (n) names.push(n); });
  if (names.length < 1) { alert('Bitte mindestens 1 Spieler eingeben!'); return; }
  const modeSel = document.getElementById('gameMode').value;
  state.mode = modeSel === 'cricket' ? 'cricket' : 'x01';
  state.startScore = state.mode === 'x01' ? parseInt(modeSel) : 0;
  state.finishMode = document.getElementById('finishMode').value;
  state.voiceOn = document.getElementById('voiceToggle').checked;
  state.players = names.map(n => ({ name:n, score: state.mode==='x01'?state.startScore:0, cricket: state.mode==='cricket'?mkCricket():null }));
  state.currentPlayer = 0; state.gameOver = false; state.history = [];
  state.stats = names.map(() => mkStats());
  turnDarts = []; current = { multiplier:1, base:null };
  document.getElementById('modeLabel').textContent = state.mode==='cricket'?'Cricket':state.startScore+' • '+(state.finishMode==='double'?'Double Out':state.finishMode==='triple'?'Triple Out':'Straight Out');
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('winnerBanner').classList.add('hidden');
  document.getElementById('statsPanel').classList.add('hidden');
  buildNumpad(); setMult(1); render();
}
function mkCricket(){ const c={}; CRICKET_TARGETS.forEach(t=>c[t]=0); return c; }
function mkStats(){ return { darts:0, points:0, turns:0, best:0, checkouts:0, busts:0, highFinish:0, tons:0 }; }
function confirmNewGame(){ if (confirm('Neues Spiel starten?')){ document.getElementById('gameScreen').classList.add('hidden'); document.getElementById('setupScreen').classList.remove('hidden'); } }

function buildNumpad() {
  const pad = document.getElementById('numpad'); pad.innerHTML = '';
  for (let n = 1; n <= 20; n++) {
    const b = document.createElement('button');
    b.textContent = n;
    b.onclick = () => pressNumber(n);
    pad.appendChild(b);
  }
  const miss = document.createElement('button');
  miss.textContent = 'MISS';
  miss.className = 'miss wide';
  miss.onclick = () => enterMiss();
  pad.appendChild(miss);
}

function pressNumber(n){
  if(state.gameOver) return;
  const mult = current.multiplier;
  const dart = { base: n, mult: mult, value: n * mult, isDouble: mult === 2, isTriple: mult === 3, miss: false };
  commitDart(dart);
}

function setMult(m){
  if(state.gameOver) return;
  current.multiplier = m;
  document.getElementById('btnSingle').classList.toggle('active', m===1);
  document.getElementById('btnDouble').classList.toggle('active', m===2);
  document.getElementById('btnTriple').classList.toggle('active', m===3);
  document.getElementById('btnBull').classList.remove('active');
  updateDisplay();
}

function setBull(){
  if(state.gameOver) return;
  current.base = 25;
  const mult = current.multiplier === 2 ? 2 : 1;
  const dart = { base: 25, mult: mult, value: 25*mult, isDouble: mult===2, isTriple: false, miss: false };
  commitDart(dart);
}

function updateDisplay(){
  const disp = document.getElementById('scoreDisplay');
  disp.textContent = `Nächster Wurf: ${current.multiplier===3?'Triple':current.multiplier===2?'Double':'Einfach'} – Zahl tippen`;
}

function commitDart(d){
  if(state.gameOver) return;
  turnDarts.push(d);
  current = { multiplier: 1, base: null };
  setMult(1);
  renderDartsBar();
  if(turnDarts.length >= 3){
    submitTurn();
  }
}

function enterMiss(){
  if(state.gameOver) return;
  commitDart({ base:0, mult:1, value:0, isDouble:false, isTriple:false, miss:true });
}

function removeLastDart(){
  if(state.gameOver) return;
  if(turnDarts.length === 0) return;
  turnDarts.pop();
  renderDartsBar();
}

function submitTurn(){
  if(state.gameOver || turnDarts.length === 0) return;
  const player = state.players[state.currentPlayer];
  const stat = state.stats[state.currentPlayer];

  state.history.push({
    players: state.players.map(p=>({...p, cricket:p.cricket?{...p.cricket}:null})),
    stats: state.stats.map(s=>({...s})),
    currentPlayer: state.currentPlayer
  });

  const turnSum = turnDarts.reduce((s,d)=>s+d.value,0);
  stat.turns++; turnDarts.forEach(d=>{ stat.darts++; stat.points += d.value; });
  stat.best = Math.max(stat.best, turnSum);
  if(turnSum >= 100) stat.tons++;

  speak(String(turnSum));

  if(state.mode === 'x01') processX01Turn(player, stat, turnSum);
  else processCricketTurn(player, stat);
}

function processX01Turn(player, stat, turnSum){
  let running = player.score;
  let bust = false;
  for(const d of turnDarts){
    const ns = running - d.value;
    if(ns < 0){ bust = true; break; }
    if(ns === 1 && state.finishMode !== 'straight'){ bust = true; break; }
    if(ns === 0){
      if(state.finishMode==='double' && !d.isDouble){ bust = true; break; }
      if(state.finishMode==='triple' && !d.isTriple){ bust = true; break; }
      player.score = 0; state.gameOver = true; stat.checkouts++;
      if(turnSum > stat.highFinish) stat.highFinish = turnSum;
      showWinner(player.name); resetTurn(); render(); return;
    }
    running = ns;
  }
  if(bust){ stat.busts++; showStatus(`BUST! ${player.name} bleibt bei ${player.score}`,'bust'); }
  else { player.score = running; showStatus(`${player.name}: −${turnSum} → ${player.score}`,'info'); }
  advancePlayer(); resetTurn(); render();
}

function processCricketTurn(player, stat){
  let scored = 0;
  for(const d of turnDarts){
    if(d.miss || d.base === 0) continue;
    const target = d.base === 25 ? 25 : d.base;
    if(!CRICKET_TARGETS.includes(target)) continue;
    const before = player.cricket[target];
    const after = Math.min(3, before + d.mult);
    const overflow = Math.max(0, before + d.mult - 3);
    player.cricket[target] = after;
    if(overflow > 0 && allOthersClosed(state.currentPlayer, target)){
      const pts = overflow * target;
      player.score += pts; stat.points += pts; scored += pts;
    }
  }
  const closedAll = CRICKET_TARGETS.every(t => player.cricket[t] >= 3);
  if(closedAll){
    const maxOthers = Math.max(0, ...state.players.filter((_,i)=>i!==state.currentPlayer).map(p=>p.score));
    if(player.score >= maxOthers){ state.gameOver = true; showWinner(player.name); resetTurn(); render(); return; }
  }
  showStatus(`${player.name}: ${scored > 0 ? '+'+scored+' Punkte' : 'geworfen'}`,'info');
  advancePlayer(); resetTurn(); render();
}

function allOthersClosed(idx, target){ return state.players.every((p,i)=>i===idx || p.cricket[target] >= 3); }
function advancePlayer(){ state.currentPlayer = (state.currentPlayer + 1) % state.players.length; }
function resetTurn(){ turnDarts = []; current = { multiplier:1, base:null }; setMult(1); renderDartsBar(); }

function undo(){
  if(state.history.length === 0){ alert('Nichts zum Rückgängigmachen'); return; }
  const prev = state.history.pop();
  state.players = prev.players; state.stats = prev.stats;
  state.currentPlayer = prev.currentPlayer; state.gameOver = false;
  document.getElementById('winnerBanner').classList.add('hidden');
  document.getElementById('inputArea').classList.remove('hidden');
  document.getElementById('statusMsg').classList.add('hidden');
  resetTurn(); render();
}

function getCheckout(score, finishMode){
  if(score > 170 || score < 2) return null;
  const finisher = finishMode==='double'?2:finishMode==='triple'?3:1;
  return suggestTwoDart(score, finisher);
}
function suggestTwoDart(score, finisherMult){
  const one = findDart(score, finisherMult); if(one) return [one];
  for(let first = 60; first >= 1; first--){
    const remaining = score - first; if(remaining < 1) continue;
    const second = findDart(remaining, finisherMult);
    if(second){ const f = findBestFirst(first); if(f) return [f, second]; }
  }
  return null;
}
function findBestFirst(value){
  if(value === 50) return {label:'Bull', value:50};
  if(value === 25) return {label:'25', value:25};
  if(value <= 20) return {label:String(value), value:value};
  if(value % 3 === 0 && value/3 <= 20) return {label:'T'+(value/3), value:value};
  if(value % 2 === 0 && value/2 <= 20) return {label:'D'+(value/2), value:value};
  return null;
}
function findDart(value, mult){
  if(mult === 2){ if(value === 50) return {label:'Bull', value:50}; if(value%2===0 && value/2<=20) return {label:'D'+(value/2), value:value}; }
  else if(mult === 3){ if(value%3===0 && value/3<=20) return {label:'T'+(value/3), value:value}; }
  else { if(value === 50) return {label:'Bull', value:50}; if(value === 25) return {label:'25', value:25}; if(value <= 20) return {label:String(value), value:value}; }
  return null;
}
function speak(text){
  if(!state.voiceOn || !window.speechSynthesis) return;
  try{ window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang='de-DE'; u.rate=1.1; window.speechSynthesis.speak(u); }catch(e){}
}

function renderDartsBar(){
  const bar = document.getElementById('dartsBar'); bar.innerHTML = '';
  for(let i = 0; i < 3; i++){
    const slot = document.createElement('div');
    slot.className = 'dart-slot';
    if(turnDarts[i]){
      slot.classList.add('filled');
      const d = turnDarts[i];
      const prefix = d.mult===2?'D':d.mult===3?'T':'';
      const label = d.miss ? 'MISS' : (d.base===25 ? (d.mult===2?'Bull':'25') : `${prefix}${d.base}`);
      slot.innerHTML = `<div class="slot-label">Wurf ${i+1}</div><div class="slot-value">${label}</div>`;
    } else if(i === turnDarts.length){
      slot.classList.add('current');
      slot.innerHTML = `<div class="slot-label">Wurf ${i+1}</div><div class="slot-value">▸ jetzt</div>`;
    } else {
      slot.innerHTML = `<div class="slot-label">Wurf ${i+1}</div><div class="slot-value">–</div>`;
    }
    bar.appendChild(slot);
  }
  const sum = turnDarts.reduce((s,d)=>s+d.value,0);
  document.getElementById('dartsSum').textContent = turnDarts.length === 0 ? '' : `Summe: ${sum} Punkte`;
}

function render(){
  const container = document.getElementById('playersScores'); container.innerHTML = '';
  state.players.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'player-card' + (idx === state.currentPlayer && !state.gameOver ? ' active' : '');
    if(state.mode === 'x01'){
      const hint = getCheckout(p.score, state.finishMode);
      const hintText = hint ? '✓ ' + hint.map(d => d.label).join(' + ') : '';
      card.innerHTML = `<div class="name">${p.name}${idx===state.currentPlayer&&!state.gameOver?' ▶':''}</div><div class="score">${p.score}</div><div class="hint">${hintText}</div>`;
    } else {
      let grid = '';
      CRICKET_TARGETS.forEach(t => {
        const m = p.cricket[t];
        const ms = m===0?'':m===1?'/':m===2?'X':'Ⓧ';
        grid += `<div>${t===25?'Bull':t}: <b style="color:${m>=3?'#4fc3f7':'#fff'}">${ms||'–'}</b></div>`;
      });
      card.innerHTML = `<div class="name">${p.name}${idx===state.currentPlayer&&!state.gameOver?' ▶':''}</div><div class="score">${p.score}</div><div class="cricket-grid">${grid}</div>`;
    }
    container.appendChild(card);
  });
  renderDartsBar(); updateDisplay();
}

function showStatus(msg, cls){
  const el = document.getElementById('statusMsg'); el.textContent = msg; el.className = 'status ' + cls;
  el.classList.remove('hidden'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.add('hidden'), 2800);
}
function showWinner(name){
  document.getElementById('winnerBanner').textContent = `🏆 ${name} GEWINNT! 🏆`;
  document.getElementById('winnerBanner').classList.remove('hidden');
  document.getElementById('inputArea').classList.add('hidden');
}
function toggleStats(){
  const panel = document.getElementById('statsPanel');
  if(panel.classList.contains('hidden')){ renderStats(); panel.classList.remove('hidden'); } else panel.classList.add('hidden');
}
function renderStats(){
  const t = document.getElementById('statsTable');
  let html = '<tr><th>Spieler</th><th>Darts</th><th>Ø/Dart</th><th>Ø/Aufn.</th><th>Best</th><th>100+</th><th>Busts</th></tr>';
  state.stats.forEach((s,i) => {
    const avgDart = s.darts ? (s.points/s.darts).toFixed(1) : '–';
    const avgTurn = s.turns ? (s.points/s.turns).toFixed(1) : '–';
    html += `<tr><td>${state.players[i].name}</td><td>${s.darts}</td><td>${avgDart}</td><td>${avgTurn}</td><td>${s.best}</td><td>${s.tons}</td><td>${s.busts}</td></tr>`;
  });
  t.innerHTML = html;
}

document.addEventListener('keydown', (e) => {
  if(document.getElementById('gameScreen').classList.contains('hidden')) return;
  if(state.gameOver) return;
  if(e.key >= '0' && e.key <= '9') pressNumber(parseInt(e.key));
  if(e.key === 'Enter') submitTurn();
  if(e.key === 'Backspace') removeLastDart();
});
</script>
</body>
</html>
